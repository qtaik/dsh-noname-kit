# 「无名杀开发模式」agent-plane 组合。
# 架构照搬 zero-anchored-standard(xiaobright/dsh-anchored-standard,MIT):
# 首轮 0 工具锚定 → 常驻集 = shell + str_replace_editor + 发现工具 + 无名杀工具链
# → 其余工具经 dev_tool_search 按需解锁。完整规范走 skill 按需加载。
#
# 服务行必须放进带 isolate 的 group(entry-local realm),否则第二会话挂载冲突。
# 纯工具行(只注册进 host tools registry、不 provide 服务)无需 realm。

# ── identity:complete 定死身份,压掉一切注入(含 noname-kit 全局 section) ──
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      你是无名杀(Noname)扩展开发工程师与工坊总指挥,只为本机游戏编写武将技能与卡牌扩展。
      任务粒度=一个完整武将(含全部技能)或一张卡牌。流程:任何任务先输出
      【需求理解确认】(逐技能:触发/频率/目标/数值/边界)并停下等用户确认,
      有歧义用 ask_user_question 问清;注意 ask_user_question 的回答只消除歧义、
      不算确认——歧义澄清后把最终确认单呈现给用户,仍须等到用户明确回复「确认」。
      未确认禁止写代码(确认前的只读调研不受限:
      可先 noname_search_reference 搜官方参考、noname_read_extension 读代码,再写确认单)。
      确认后逐技能实现,写完 noname_validate 校验通过后 noname_write_extension 写入,
      图片复制进 image/ 子目录,配音复制进 audio/skill|audio/die 子目录(绝不放本体目录),
      全部完成调
      noname_skills_written 并提示测试。改已有包优先区块模式(listBlocks/block 按块读,
      blocks/edits/deletes 提交,老代码由工具保留);全文模式仅首写或未建索引的包,
      且必须带 editScope。完整规范与示例用 skill_load 加载 noname-extension-dev 技能;
      先想清方案再交付,交付前自查一遍。
    complete: true
    includeRuntimeContext: false

# 锚定轮晋级后,一次性提示"指令文件存在,需要时自己读"
- id: instruction-hint
  name: ./instruction-hint.mjs
  config:
    promoteOn: assistant-message

# 重工具按需解锁(web 等注册在 catalog 但平时隐藏)
- id: dev-tool-search
  name: ./dev-tool-search.mjs

# 首轮 0 工具;晋级后常驻集 = shells + str_replace_editor + 发现工具 + 无名杀链
- id: zero-tool-bootstrap
  name: ./zero-tool-bootstrap.mjs
  config:
    suppressedContextSources: [agent-instructions, skill-catalog]
    residentTools: [noname_search_reference, noname_validate, noname_read_extension, noname_write_extension, noname_skills_written, noname_copy_images, noname_copy_audio]
    compactionTools: [read, glob, grep, noname_search_reference, noname_validate, noname_read_extension, noname_write_extension, noname_skills_written, noname_copy_images, noname_copy_audio]

# 锚定轮固定用户消息
- id: anchor-turn
  name: ./anchor-turn.mjs
  config:
    text: 这一轮是无名杀开发模式的锚定轮,工具尚未开放;从下一轮起工具开放。

# ── shell(Windows 走 Git Bash 适配行) ─────────────────────────────────────
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: custom-bash
  name: ./custom-bash.mjs
  disabled: !!js process.platform !== 'win32'
  config:
    # Git Bash 路径自动探测(Program Files / (x86) / LOCALAPPDATA);非标准安装请显式指定:
    #   bashPath: 'D:/Git/bin/bash.exe'
    # bash 单次输出上限(阀门)在工坊「⚙ 设置」页调节(默认 64K,可调 64~256K);
    # 高级用户也可在此手改: maxOutputBytes: 64000(行配置优先于设置页)。

# ── filesystem ──────────────────────────────────────────────────────────────
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: bootstrap-filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

    - id: str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000

# ── skills:注册表在本 preset 层;目录不注入,按需 search/load ────────────────
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: skill-search
  name: ./skill-search.mjs

# ── compaction:长会话必需 ───────────────────────────────────────────────────
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── 其余模型面工具(轻量;web 注册但平时隐藏) ────────────────────────────────
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
