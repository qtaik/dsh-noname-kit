# 目录式预设。部分实现改编自 xiaobright/dsh-anchored-standard（MIT）。
# 在带 isolate 的 group 内注册会话服务，避免多个会话挂载时争用同一服务。
# 只注册工具的插件可以直接挂载在预设中。

- id: noname-tools
  name: ./tools.mjs

- id: noname-environment-context
  name: ./environment-context.mjs

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      你是无名杀(Noname)扩展开发工程师，目标是完成用户要求的武将、卡牌或游戏模式，并减少实际游戏中的错误。
      开始开发、审查或排错前，用 skill_load 加载 noname-extension-dev；同一会话已读且内容未变时复用。它是开发流程和专业规范的主来源，任务消息提供本次目标、素材与写入方式，工具说明规定实际参数与限制。
      只读讨论按用户要求答复。接到新建武将、卡牌、模式或修改已有玩法的任务时，确认前可以只读查阅现有扩展、同类官方实现和当前引擎。
      逐技能或逐条规则核对需求，列出完整的【需求理解确认】清单。已明确的内容写成简明的玩法结论。只有现有信息无法确定、且不同答案会改变玩法的内容，才在对应条目下标为「待确认」。
      使用 ask_user_question 集中问清待确认项。宿主无法提供提问工具时用文字提问。收到答复后更新对应条目，给出完整的最终清单。没有待确认项时，直接给出完整清单。
      给出最终清单后停下来，等待用户明确回复「确认」。单独回答澄清问题只代表该项已经明确。收到对最终清单的确认后，才开始编写和写入代码。
      已确认方案内的错误修复按原规则继续。需要改变玩法或扩大范围时，列出变更部分并等待用户明确回复「确认」。
      先读已有代码，查相似实现和当前引擎的实际用法，再编写代码；可组合参考，复用源码未变的已核实结论，证据足够后停止扩查。不能凭记忆编造接口，也不能将未搜到说成不存在。无法核实时说明具体缺口。
      修改范围限于本次目标、勾选技能及完成需求必需的直接关联代码；先核对归属和必要性，保留无关条目，不顺带重构或新增玩法。扩展源码使用 noname_write_extension，素材使用对应复制工具；遵守手动方式、宿主权限、预算、超时与取消，不绕过写入保护。
      按实际文件校验并核对玩法；完成后只登记本轮实际实现或修改的任务节点，保留其他节点状态。区分源码完成、静态检查和游戏实测，按证据说明结果。
    complete: true
    includeRuntimeContext: false

# 工具选择按原生工具名工作，使用预设级呈现避免继承部署的 PTC 包装。
- id: noname-tool-presentation
  name: '@deepseek-ai/dsh-agent-tool-presentation'
  disabled: !!js (() => { const require = process.getBuiltinModule('node:module').createRequire(String(baseUrl)); try { require.resolve('@deepseek-ai/dsh-tool-executor-native/package.json'); return true } catch {} try { require.resolve('@deepseek-ai/dsh-agent-tool-presentation/package.json'); return false } catch { return true } })()
  config:
    mode: native

- id: instruction-hint
  name: ./instruction-hint.mjs
  config:
    promoteOn: assistant-message

- id: dev-tool-search
  name: ./dev-tool-search.mjs

- id: zero-tool-bootstrap
  name: ./zero-tool-bootstrap.mjs
  config:
    suppressedContextSources: [agent-instructions, skill-catalog]
    residentTools: [ask_user_question, noname_list_catalog, noname_read_catalog, noname_search_reference, noname_validate, noname_read_extension, noname_write_extension, noname_skills_written, noname_copy_images, noname_copy_audio, noname_copy_videos]
    compactionTools: [read, glob, grep, dev_tool_search, skill_search, skill_load, ask_user_question, noname_list_catalog, noname_read_catalog, noname_search_reference, noname_validate, noname_read_extension, noname_write_extension, noname_skills_written, noname_copy_images, noname_copy_audio, noname_copy_videos]

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: custom-bash
  name: ./custom-bash.mjs
  disabled: !!js process.platform !== 'win32'
  config:
    # 非标准 Git Bash 安装可指定 bashPath，例如 'D:/Git/bin/bash.exe'。
    # 此处设置的 maxOutputBytes 优先于工坊设置。

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: bootstrap-filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

    - id: str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000

# 技能目录在本预设中注册，由 skill_load 按需注入内容。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: skill-search
  name: ./skill-search.mjs

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
